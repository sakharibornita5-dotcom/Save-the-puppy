<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Draw walls, pull pins and save the pup from the bees."><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet"><title>Save the Pup</title>
<style>
:root{--bg:#bfe6ff;--card:#fff7e6;--ink:#2b1b3d;--pri:#ff6f91;--sec:#5fd4a0;--sun:#ffc93c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a1f3d;--card:#3a2c52;--ink:#fff1dc}}
:root[data-theme="dark"]{--bg:#2a1f3d;--card:#3a2c52;--ink:#fff1dc}
html,body{height:100%;margin:0}
*,*::before,*::after{box-sizing:inherit}
body{background:var(--bg);color:var(--ink);font-family:"Fredoka","Trebuchet MS",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px}
.bar{width:100%;max-width:820px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:1.5rem;margin:0;flex:1;min-width:120px}
.pill{background:var(--card);border-radius:999px;padding:4px 14px;font-weight:700}
.ink{flex:1;min-width:120px;height:14px;background:var(--card);border-radius:99px;overflow:hidden;border:2px solid var(--ink)}
.ink i{display:block;height:100%;width:100%;background:var(--pri);transition:width .1s}
button{font:inherit;font-weight:700;border:3px solid var(--ink);border-radius:99px;padding:4px 14px;background:var(--sec);color:#2b1b3d;cursor:pointer;box-shadow:0 4px 0 var(--ink);transition:transform .08s,box-shadow .08s}button:active{transform:translateY(4px);box-shadow:0 0 0 var(--ink)}button[aria-pressed=false]{opacity:.55;text-decoration:line-through}.pill{border:2px solid var(--ink)}@media (prefers-reduced-motion:reduce){button{transition:none}}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.wrap{position:relative;width:100%;max-width:820px}
canvas{width:100%;height:auto;display:block;border-radius:24px;touch-action:none;border:4px solid var(--ink)}
#ov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;background:rgba(74,44,26,.55);border-radius:24px;text-align:center;color:#fff}
#ov h2{font-size:2.2rem;margin:0}
#ov .row{display:flex;gap:10px}
#sel,#how,#tro{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:var(--card);border-radius:24px}
#sel h2{margin:0}#sg{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:min(90%,420px)}#sg button{background:var(--sun);color:#4a2c1a;padding:10px 4px;line-height:1.2}
#ed button.on{outline:3px solid var(--ink);outline-offset:1px}#ed input{font:inherit;border:0;background:transparent;color:var(--ink)}
#how{z-index:2}#how h2{margin:0}#how ol{margin:0;padding:0 0 0 1.3em;width:min(90%,420px);text-align:left;font-size:1.1rem;line-height:1.5}
#tro{z-index:2;overflow:auto;justify-content:flex-start!important;padding:14px 0}#tro h2{margin:0}
#st{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:min(92%,460px)}.sx{background:var(--sun);border:2px solid var(--ink);border-radius:14px;padding:6px;text-align:center;color:#2b1b3d;line-height:1.1;font-size:.9rem}.sx b{display:block;font-size:1.4rem}
#al{list-style:none;margin:0;padding:0;width:min(92%,460px);text-align:left;display:grid;gap:5px}#al li{border:2px solid var(--ink);border-radius:12px;padding:5px 10px}#al li.lock{opacity:.45}
#ts{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:var(--sun);color:#2b1b3d;border:3px solid var(--ink);border-radius:99px;padding:4px 14px;font-weight:700;opacity:0;transition:opacity .3s;pointer-events:none;z-index:3;white-space:nowrap}
p.tip{margin:0;max-width:820px;text-align:center;opacity:.85}
</style>
</head>
<body>
<div class="bar"><h1>Save the Pup</h1><span class="pill" id="lv"></span><span class="pill" id="tm"></span><div class="ink" title="Ink left"><i id="ib"></i></div><button id="mu" aria-pressed="true">Music</button><button id="sf" aria-pressed="true">Sound</button><button id="eb">Editor</button><button id="lb">Levels</button><button id="rs">Retry</button></div>
<div class="wrap"><canvas id="c" width="800" height="500"></canvas><div id="ov"><h2 id="ot"></h2><div id="os" style="font-size:2rem"></div><div class="row"><button id="ob1"></button><button id="ob2">Retry</button></div></div></div><div id="sel"><h2>Pick a level</h2><div id="sg"></div></div><div id="how"><h2>How to play</h2><ol><li>Drag on the game to draw a wall. Walls stop the bees but use up your ink.</li><li>Tap a gold pin to drop a rock. Rocks squash the bees they hit.</li><li>Keep the pup safe until the timer ends. Less ink used means more stars.</li></ol><button id="hg">Got it</button></div><div id="tro"><h2>Trophies</h2><div id="st"></div><ul id="al"></ul><button id="tc">Close</button></div><div id="ts" role="status"></div></div>
<div class="bar" id="ed" style="display:none"><button data-t="dog">Pup</button><button data-t="hive" class="on">Hive</button><button data-t="rock">Rock</button><button data-t="plat">Wall</button><button data-t="erase">Erase</button><label class="pill">Ink <input id="ei" type="number" value="800" min="200" max="1500" step="50" style="width:64px"></label><label class="pill">Time <input id="eti" type="number" value="10" min="5" max="30" style="width:48px"></label><button id="et">Test level</button><button id="es">Save level</button><button id="ex">Exit editor</button><span id="em" class="pill" style="flex-basis:100%;background:transparent"></span></div>
<div class="bar" style="justify-content:center"><p class="tip" id="tp" aria-live="polite"></p><button id="hb">Hint</button><button id="hp">How to play</button><button id="tb">Trophies</button></div>
<script>
const C=document.getElementById('c'),X=C.getContext('2d'),W=800,H=500,GY=470;
const LV=[
{dog:[400,442],hives:[[120,110]],ink:700,t:8,plat:[],rocks:[]},
{dog:[400,442],hives:[[100,120],[700,120]],ink:900,t:8,plat:[],rocks:[]},
{dog:[170,442],hives:[[690,200]],ink:700,t:9,plat:[[420,150,540,185]],rocks:[[485,140,20]]},
{dog:[600,442],hives:[[100,130],[700,90]],ink:900,t:10,plat:[[80,230,260,262]],rocks:[[180,222,20]]},
{dog:[400,442],hives:[[60,200],[740,200]],ink:800,t:9,plat:[],rocks:[]},
{dog:[400,442],hives:[[400,60]],ink:500,t:10,plat:[[300,300,500,300]],rocks:[]},
{dog:[130,442],hives:[[700,100]],ink:700,t:9,plat:[[330,200,470,230]],rocks:[[400,192,20]]},
{dog:[400,442],hives:[[80,100],[400,60],[720,100]],ink:1000,t:9,plat:[],rocks:[]},
{dog:[650,442],hives:[[100,200]],ink:800,t:10,plat:[[60,260,220,290],[280,340,440,370]],rocks:[[140,252,20]]},
{dog:[200,442],hives:[[700,90],[700,300]],ink:800,t:10,plat:[[500,150,620,180]],rocks:[[560,143,20]]},
{dog:[400,442],hives:[[80,90],[720,90]],ink:700,t:10,plat:[[120,180,240,215],[560,215,680,180]],rocks:[[180,176,20],[620,176,20]]},
{dog:[400,442],hives:[[60,120],[400,50],[740,120]],ink:1000,t:12,plat:[[330,250,470,250]],rocks:[]}
];
let A;try{A=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}
function tone(f,d,t,v){if(!A)return;try{const o=A.createOscillator(),g=A.createGain();o.type=t||'sine';o.frequency.value=f;g.gain.value=v||.06;g.gain.exponentialRampToValueAtTime(.001,A.currentTime+d);o.connect(g);g.connect(A.destination);o.start();o.stop(A.currentTime+d)}catch(e){}}
let li=0,S,drawing=false,last=null,T=0;
function load(i){if(EN&&i!==LV.length-1){LV.pop();EN=0}li=i;const L=LV[i];S={dog:{x:L.dog[0],y:L.dog[1]},hives:L.hives.map(h=>({x:h[0],y:h[1],n:0,cd:0})),
segs:[[0,GY,W,GY]].concat(L.plat.map(p=>p.slice())),user:[],bees:[],
rocks:L.rocks.map(r=>({x:r[0],y:r[1],r:r[2],vx:0,vy:0,pinned:true})),ink:L.ink,t:0,state:'play'};
document.getElementById('ov').style.display='none';document.getElementById('sel').style.display='none';document.getElementById('lv').textContent='Level '+(i+1)+'/'+LV.length;setTip(i)}
function col(o,r,e){for(const s of S.segs.concat(S.user)){const a=s[0],b=s[1],c=s[2],d=s[3],dx=c-a,dy=d-b;let t=((o.x-a)*dx+(o.y-b)*dy)/(dx*dx+dy*dy);t=Math.max(0,Math.min(1,t));const qx=a+t*dx,qy=b+t*dy;let nx=o.x-qx,ny=o.y-qy;const dd=Math.hypot(nx,ny),rr=r+(s.u?4:1);if(dd<rr&&dd>0){nx/=dd;ny/=dd;o.x+=nx*(rr-dd);o.y+=ny*(rr-dd);const vn=o.vx*nx+o.vy*ny;if(vn<0){o.vx-=(1+e)*vn*nx;o.vy-=(1+e)*vn*ny}}}}
function end(win){S.state=win?'win':'lose';const left=S.ink/LV[li].ink,st=win?(left>.6?3:left>.3?2:1):0;
if(win){if(!E.on){stat('wins');if(st===3)stat('three');if(left>.8)stat('thrifty');if((FL[li]||0)>=3)stat('comeback')}if(EN){if(EN>EB){EB=EN;try{localStorage.setItem('pup-best',EB)}catch(e){}}}else if(!E.on)save(li,st)}else if(!E.on)stat('losses');chk();document.getElementById('ot').textContent=win?'Pup saved!':'Bzzzt! Stung!';document.getElementById('os').textContent=win?'★'.repeat(st)+'☆'.repeat(3-st):'';
const b1=document.getElementById('ob1');b1.style.display=win&&(EN||li<LV.length-1||li===11)?'':'none';b1.textContent='Next level';
document.getElementById('ov').style.display='flex';if(!win)FL[li]=(FL[li]||0)+1;win?snd(660,.4,'triangle'):snd(120,.5,'sawtooth')}
function step(dt){if(S.state!=='play'||document.getElementById('sel').style.display==='flex'||document.getElementById('how').style.display==='flex'||document.getElementById('tro').style.display==='flex')return;S.t+=dt;PS.secs+=dt;
for(const h of S.hives){h.cd-=dt;if(h.cd<=0&&h.n<8){h.cd=.6;h.n++;S.bees.push({x:h.x,y:h.y,vx:0,vy:0,ph:Math.random()*6})}}
for(const b of S.bees){const dx=S.dog.x-b.x,dy=S.dog.y-b.y,d=Math.hypot(dx,dy)||1;b.ph+=dt*12;b.vx+=(dx/d*(LV[li].sp||80)-b.vx)*.1;b.vy+=(dy/d*(LV[li].sp||80)-b.vy)*.1+Math.sin(b.ph)*.6;b.x+=b.vx*dt;b.y+=b.vy*dt;col(b,6,0);if(d<24){end(false);return}}
for(const r of S.rocks){if(r.pinned)continue;r.vy+=900*dt;r.vx*=.995;r.x+=r.vx*dt;r.y+=r.vy*dt;col(r,r.r,.2);
const sp=Math.hypot(r.vx,r.vy);S.bees=S.bees.filter(b=>{const k=Math.hypot(b.x-r.x,b.y-r.y)<r.r+6&&sp>40;if(k){snd(300,.1,'square',.04);puff(b.x,b.y);stat('bees')}return !k})}
if(S.t>=LV[li].t)end(true)}
const INK='#2b1b3d';let TT=0;const PT=[];
function ol(w){X.lineWidth=w||4;X.strokeStyle=INK;X.lineJoin='round';X.lineCap='round'}
function blob(x,y,rx,ry,c,w){X.fillStyle=c;X.beginPath();X.ellipse(x,y,rx,ry,0,0,7);X.fill();ol(w);X.stroke()}
function puff(x,y){for(let i=0;i<8;i++){const a=i/8*6.28;PT.push({x,y,vx:Math.cos(a)*90,vy:Math.sin(a)*90,l:.5})}}
function dogArt(x,y,sad,win){y+=sad?0:win?-Math.abs(Math.sin(TT*8))*14:Math.sin(TT*5)*2;
blob(x,y+20,17,11,'#e9a15b');blob(x-20,y+2,8,15,'#a8642b');blob(x+20,y+2,8,15,'#a8642b');blob(x,y,22,20,'#e9a15b');blob(x,y+7,11,8,'#fff7e6',3);
X.fillStyle=INK;X.beginPath();X.ellipse(x,y+3,4,3,0,0,7);X.fill();
if(sad){ol(3);for(const d of[-9,9]){X.beginPath();X.moveTo(x+d-3,y-8);X.lineTo(x+d+3,y-2);X.moveTo(x+d+3,y-8);X.lineTo(x+d-3,y-2);X.stroke()}}
else{X.beginPath();X.arc(x-9,y-5,3.2,0,7);X.arc(x+9,y-5,3.2,0,7);X.fill();blob(x,y+14,3,4,'#ff6f91',2)}}
function beeArt(b){X.save();X.translate(b.x,b.y);if(b.vx<0)X.scale(-1,1);const f=Math.sin(b.ph*2)*.5+.5;
X.fillStyle='rgba(255,255,255,.9)';X.beginPath();X.ellipse(-2,-8,5,3+7*f,-.5,0,7);X.fill();ol(2);X.stroke();
blob(0,0,10,7,'#ffc93c',2.5);X.fillStyle=INK;X.fillRect(-3,-6,3,12);X.beginPath();X.arc(5,-2,1.6,0,7);X.fill();X.restore()}
function hiveArt(h){const y=h.y+Math.sin(TT*2+h.x)*2;blob(h.x,y,24,22,'#ffb84d');ol(2.5);for(const d of[-8,2]){X.beginPath();X.moveTo(h.x-20,y+d);X.quadraticCurveTo(h.x,y+d+5,h.x+20,y+d);X.stroke()}blob(h.x,y+9,7,5,INK,2)}
function draw(){const now=performance.now()/1000,dt=Math.min(.05,now-TT||0);TT=now;
const g=X.createLinearGradient(0,0,0,H);g.addColorStop(0,'#8fdcff');g.addColorStop(1,'#e3f8ff');X.fillStyle=g;X.fillRect(0,0,W,H);
X.fillStyle='rgba(255,255,255,.9)';for(let i=0;i<3;i++){const cx=((TT*10+i*300)%1000)-100,cy=70+i*55;X.beginPath();X.ellipse(cx,cy,50,16,0,0,7);X.ellipse(cx+28,cy-10,30,14,0,0,7);X.fill()}
X.fillStyle='#6fd66a';X.fillRect(0,GY,W,H-GY);ol();X.beginPath();X.moveTo(0,GY);X.lineTo(W,GY);X.stroke();
for(let i=1;i<S.segs.length;i++){const q=S.segs[i];for(const[w,c]of[[16,INK],[9,'#c98b52']]){X.lineWidth=w;X.strokeStyle=c;X.lineCap='round';X.beginPath();X.moveTo(q[0],q[1]);X.lineTo(q[2],q[3]);X.stroke()}}
for(const q of S.user){for(const[w,c]of[[12,INK],[6,'#ff6f91']]){X.lineWidth=w;X.strokeStyle=c;X.lineCap='round';X.beginPath();X.moveTo(q[0],q[1]);X.lineTo(q[2],q[3]);X.stroke()}}
for(const h of S.hives)hiveArt(h);
for(const r of S.rocks){blob(r.x,r.y,r.r,r.r,'#a3a8bd');X.fillStyle='#fff';X.beginPath();X.arc(r.x-6,r.y-4,4,0,7);X.arc(r.x+6,r.y-4,4,0,7);X.fill();X.fillStyle=INK;X.beginPath();X.arc(r.x-6,r.y-4,2,0,7);X.arc(r.x+6,r.y-4,2,0,7);X.fill();
if(r.pinned){const pr=11+Math.sin(TT*6)*1.6;blob(r.x-r.r-14,r.y-6,pr,pr,'#ffc93c',3);X.fillStyle=INK;X.fillRect(r.x-r.r-6,r.y-9,14,5)}}
dogArt(S.dog.x,S.dog.y,S.state==='lose',S.state==='win');
for(const b of S.bees)beeArt(b);
for(let i=PT.length-1;i>=0;i--){const p=PT[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt;if(p.l<=0){PT.splice(i,1);continue}X.globalAlpha=p.l*2;X.fillStyle='#ffc93c';X.beginPath();X.arc(p.x,p.y,4,0,7);X.fill();X.globalAlpha=1}
document.getElementById('ib').style.width=Math.max(0,S.ink/LV[li].ink*100)+'%';document.getElementById('tm').textContent=Math.max(0,Math.ceil(LV[li].t-S.t))+'s';
if(E.on&&E.start){X.fillStyle='#ff6f91';X.beginPath();X.arc(E.start.x,E.start.y,7,0,7);X.fill()}}
let prev=0;function loop(ts){const dt=Math.min(.033,(ts-prev)/1000||0);prev=ts;step(dt/2);step(dt/2);draw();requestAnimationFrame(loop)}
function pt(e){const r=C.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
C.addEventListener('pointerdown',e=>{if(E.on&&S.state==='edit'){edit(pt(e));return}if(S.state!=='play')return;if(A&&A.state==='suspended')A.resume();const p=pt(e);
for(const r of S.rocks)if(r.pinned&&Math.hypot(p.x-(r.x-r.r-14),p.y-(r.y-6))<26){r.pinned=false;stat('pins');snd(880,.1,'triangle');return}
drawing=true;last=p;C.setPointerCapture(e.pointerId)});
C.addEventListener('pointermove',e=>{if(!drawing||S.state!=='play')return;const p=pt(e),d=Math.hypot(p.x-last.x,p.y-last.y);
if(d>=8&&S.ink>=d){const s=[last.x,last.y,p.x,p.y];s.u=1;S.user.push(s);S.ink-=d;last=p;snd(500+S.ink%200,.03,'sine',.02)}});
C.addEventListener('pointerup',()=>drawing=false);C.addEventListener('pointercancel',()=>drawing=false);
document.getElementById('rs').onclick=()=>load(li);document.getElementById('ob2').onclick=()=>load(li);document.getElementById('ob1').onclick=()=>{if(EN)playEn(EN+1);else if(li===11)playEn(13);else load(li+1)};
let SV={};try{SV=JSON.parse(localStorage.getItem('pup-stars')||'{}')}catch(e){}
function save(i,n){if((SV[i]||0)<n){SV[i]=n;try{localStorage.setItem('pup-stars',JSON.stringify(SV))}catch(e){}}}
function sel(){const g=document.getElementById('sg');g.innerHTML='';LV.forEach((_,i)=>{if(E.on&&i===LV.length-1)return;const b=document.createElement('button'),n=SV[i]||0;b.innerHTML='<b>'+(i+1)+'</b><br>'+'★'.repeat(n)+'☆'.repeat(3-n);b.onclick=()=>load(i);g.appendChild(b)});if(SV[11]>0){const b=document.createElement('button');b.style.gridColumn='1/-1';b.textContent='Endless mode: level '+Math.max(13,EB+1);b.onclick=()=>playEn(Math.max(13,EB+1));g.appendChild(b)}document.getElementById('sel').style.display='flex'}
document.getElementById('lb').onclick=sel;
const E={on:false,tool:'hive',start:null,lv:{dog:[400,442],hives:[],ink:800,t:10,plat:[],rocks:[]}},CU=[];let ED=0;
try{JSON.parse(localStorage.getItem('pup-custom')||'[]').forEach(l=>{CU.push(l);LV.push(l)})}catch(e){}
const $=id=>document.getElementById(id);
function msg(t){$('em').textContent=t}
function view(){LV[ED]=E.lv;load(ED);S.state='edit';$('lv').textContent='Editing';$('et').textContent='Test level'}
function edit(p){const L=E.lv,t=E.tool;
if(t==='dog')L.dog=[p.x,p.y];
else if(t==='hive'){if(L.hives.length<4)L.hives.push([p.x,p.y]);else msg('Max 4 hives')}
else if(t==='rock'){if(L.rocks.length<4)L.rocks.push([p.x,p.y,20]);else msg('Max 4 rocks')}
else if(t==='plat'){if(!E.start){E.start=p;msg('Now tap where the wall ends')}else{L.plat.push([E.start.x,E.start.y,p.x,p.y]);E.start=null;msg('')}}
else{const d=(x,y)=>Math.hypot(x-p.x,y-p.y);let best=0,bd=50,arr=null;
[[L.hives,a=>d(a[0],a[1])],[L.rocks,a=>d(a[0],a[1])],[L.plat,a=>d((a[0]+a[2])/2,(a[1]+a[3])/2)]].forEach(([ar,f])=>ar.forEach((a,i)=>{const v=f(a);if(v<bd){bd=v;best=i;arr=ar}}));if(arr)arr.splice(best,1)}
view()}
function exitEd(){if(!E.on)return;E.on=false;E.start=null;LV.pop();$('ed').style.display='none';load(0)}
document.querySelectorAll('#ed [data-t]').forEach(b=>b.onclick=()=>{E.tool=b.dataset.t;E.start=null;document.querySelectorAll('#ed [data-t]').forEach(x=>x.classList.toggle('on',x===b))});
$('eb').onclick=()=>{if(E.on)return;E.on=true;ED=LV.length;LV.push(E.lv);$('ed').style.display='flex';$('ov').style.display='none';$('sel').style.display='none';view();msg('Tap the canvas to place things. Rocks fall once you tap their pin, so give them a slope.')};
$('et').onclick=()=>{if(S.state==='edit'){if(!E.lv.hives.length){msg('Add a hive first');return}E.start=null;load(ED);$('lv').textContent='Testing';$('et').textContent='Back to edit'}else view()};
$('ei').onchange=e=>{E.lv.ink=Math.max(200,Math.min(1500,+e.target.value||800));view()};
$('eti').onchange=e=>{E.lv.t=Math.max(5,Math.min(30,+e.target.value||10));view()};
$('es').onclick=()=>{if(!E.lv.hives.length){msg('Add a hive first');return}const c=JSON.parse(JSON.stringify(E.lv));CU.push(c);LV.splice(ED,0,c);ED++;try{localStorage.setItem('pup-custom',JSON.stringify(CU))}catch(e){}msg('Saved as level '+ED+'. Find it under Levels.');chk()};
$('ex').onclick=exitEd;
$('lb').onclick=()=>{exitEd();sel()};
let ST={music:true,sfx:true};try{Object.assign(ST,JSON.parse(localStorage.getItem('pup-set')||'{}'))}catch(e){}
function snd(f,d,t,v){if(ST.sfx)tone(f,d,t,v)}
const NT=[262,294,330,392,440,392,330,294,262,330,392,523,440,392,330,294];let mi=0,mt=null;
function startMusic(){if(mt||!A)return;mt=setInterval(()=>{if(!ST.music||A.state!=='running'||document.hidden)return;const f=NT[mi++%NT.length];tone(f,.35,'triangle',.025);if(mi%4===1)tone(f/2,.6,'sine',.03)},320)}
function tg(id,k){const b=document.getElementById(id);b.setAttribute('aria-pressed',ST[k]);b.onclick=()=>{ST[k]=!ST[k];b.setAttribute('aria-pressed',ST[k]);try{localStorage.setItem('pup-set',JSON.stringify(ST))}catch(e){}}}
tg('mu','music');tg('sf','sfx');
addEventListener('pointerdown',()=>{if(A&&A.state==='suspended')A.resume();startMusic()});
const COACH=['Drag on the game to draw a wall between the bees and the pup.','Bees come from both sides, so one arch over the pup does the job.','Tap the gold pin to drop the rock and squash the bees.'];
const HINTS=['Draw a roof above the pup. Bees cannot fly through walls.','One arch over the pup blocks both sides. Keep some ink in reserve.','Wait until the bees fly near the rock, then tap the pin.','Three hives means three directions. Wall off the top first.','Bees come from both sides. An arch over the pup uses less ink than two long walls.','Ink is tight and the bees come from above, so a small roof is enough.','The rock only helps if bees fly into it. Let them gather, then pull the pin.','Three hives: block the top first, then the sides.','The rock rolls down the slope. Guide the bees into its path with a wall.','Pull the pin when the bees are near the rock, then wall off the rest.','Two rocks: pull both pins once the bees have gathered.','Longest level: wall the pup in early and keep ink in reserve.'];
let FL={};
function setTip(i){if(E.on)return;$('tp').textContent=(FL[i]||0)>=2?'Hint: '+(HINTS[i]||'Put walls between the hives and the pup, and keep some ink in reserve.'):(COACH[i]||'Draw walls to block the bees. Tap gold pins to drop rocks.')}
$('hb').onclick=()=>{if(E.on)return;FL[li]=Math.max(FL[li]||0,2);setTip(li)};
function how(v){$('how').style.display=v?'flex':'none'}
$('hp').onclick=()=>how(true);
$('hg').onclick=()=>{how(false);try{localStorage.setItem('pup-seen','1')}catch(e){}};
let EN=0,EB=0;try{EB=+localStorage.getItem('pup-best')||0}catch(e){}
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function gen(n){const R=rng(n*7919+13),d=n-12,k=Math.min(4,2+Math.floor(d/5)),plat=[],rocks=[],hives=[];
for(let i=0;i<k;i++)hives.push([Math.round(60+(i+R()*.7)*(680/k)),Math.round(60+R()*190)]);
if(R()<Math.max(.25,.9-d*.04)){const x=Math.round(100+R()*450),y=Math.round(170+R()*100);plat.push([x,y,x+130,y+30]);rocks.push([x+50,y-14,20])}
for(let i=0;i<Math.min(3,Math.floor(d/3));i++){const x=Math.round(60+R()*600),y=Math.round(110+R()*190);plat.push([x,y,Math.round(x+90+R()*70),Math.round(y+(R()-.5)*50)])}
return{dog:[Math.round(150+R()*500),442],hives,ink:Math.max(600,900+k*70-d*18),t:Math.min(20,9+k+Math.floor(d/3)),sp:Math.min(130,80+d*2),plat,rocks}}
function clearEn(){if(EN){LV.pop();EN=0}}
function playEn(n){if(EN)LV.pop();EN=n;LV.push(gen(n));load(LV.length-1);FL[li]=0;$('lv').textContent='Endless '+n}
const eb0=$('eb').onclick;$('eb').onclick=()=>{clearEn();eb0()};
const lb0=$('lb').onclick;$('lb').onclick=()=>{clearEn();lb0()};
let PS={bees:0,wins:0,losses:0,pins:0,three:0,thrifty:0,comeback:0,secs:0},AU=[];
try{Object.assign(PS,JSON.parse(localStorage.getItem('pup-stats')||'{}'));AU=JSON.parse(localStorage.getItem('pup-ach')||'[]')}catch(e){}
const stars=()=>Object.values(SV).reduce((a,b)=>a+(+b||0),0);
const ACH=[['first','First rescue','Save the pup once.',()=>PS.wins>=1],['sq25','Bee squasher','Squash 25 bees with rocks.',()=>PS.bees>=25],['sq200','Swarm smasher','Squash 200 bees.',()=>PS.bees>=200],['pin10','Pin puller','Pull 10 pins.',()=>PS.pins>=10],['three','Perfect run','Win a level with 3 stars.',()=>PS.three>=1],['thrifty','Penny pincher','Win with over 80% of your ink left.',()=>PS.thrifty>=1],['comeback','Never give up','Win a level after losing 3 times.',()=>PS.comeback>=1],['half','Halfway there','Clear level 6.',()=>SV[5]>0],['twelve','Bee-free zone','Clear level 12.',()=>SV[11]>0],['stars24','Star collector','Earn 24 stars in total.',()=>stars()>=24],['endless','Into the endless','Clear an endless level.',()=>EB>=13],['endless25','Endless veteran','Clear endless level 25.',()=>EB>=25],['maker','Level maker','Save a level from the editor.',()=>CU.length>=1]];
function stat(k,n){PS[k]=(PS[k]||0)+(n||1)}
function persist(){try{localStorage.setItem('pup-stats',JSON.stringify(PS));localStorage.setItem('pup-ach',JSON.stringify(AU))}catch(e){}}
function toast(t){const d=$('ts');d.textContent=t;d.style.opacity=1;clearTimeout(toast.h);toast.h=setTimeout(()=>d.style.opacity=0,2600)}
function chk(){for(const a of ACH)if(!AU.includes(a[0])&&a[3]()){AU.push(a[0]);toast('Trophy: '+a[1]);snd(784,.3,'triangle')}persist()}
function tro(){const T=[[PS.bees,'Bees squashed'],[PS.wins,'Levels cleared'],[PS.losses,'Lost tries'],[PS.pins,'Pins pulled'],[Math.floor(PS.secs/60),'Minutes played'],[stars(),'Stars earned']];
$('st').innerHTML=T.map(t=>'<div class="sx"><b>'+t[0]+'</b>'+t[1]+'</div>').join('');
$('al').innerHTML=ACH.map(a=>'<li'+(AU.includes(a[0])?'':' class="lock"')+'><b>'+a[1]+'</b><br>'+a[2]+'</li>').join('');$('tro').style.display='flex'}
$('tb').onclick=tro;$('tc').onclick=()=>{$('tro').style.display='none'};
addEventListener('visibilitychange',()=>{if(document.hidden)persist()});
load(0);requestAnimationFrame(loop);
let seen=false;try{seen=localStorage.getItem('pup-seen')}catch(e){}
if(!seen)how(true);
</script>
